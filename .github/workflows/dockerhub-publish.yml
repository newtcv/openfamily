name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tagname:
        description: Docker tag to publish as newtcv/openfamily:<tagname>
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag input
        env:
          TAGNAME: ${{ inputs.tagname }}
        run: |
          set -euo pipefail
          if ! [[ "$TAGNAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid tagname '$TAGNAME'. Use Docker tag-safe characters: [A-Za-z0-9_.-], max 128 chars, and do not start with '.' or '-'" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing required secrets: DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: newtcv/openfamily:${{ inputs.tagname }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
